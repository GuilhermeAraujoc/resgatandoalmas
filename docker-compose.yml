services:

  frontend:
    build:
      context: ./frontend
    container_name: resgatando_almas_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_PROXY_TARGET: http://backend:3001
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: resgatando_almas_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: resgatando_almas
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/resgatando_almas?schema=public
      APP_TIMEZONE: America/Sao_Paulo
      # Requests arrive through the Vite dev proxy on the Docker network.
      TRUST_PROXY: uniquelocal
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: resgatando_almas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resgatando_almas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resgatando_almas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: